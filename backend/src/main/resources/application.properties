spring.application.name=ats-backend
server.port=${PORT:8080}

# ---- MySQL ----
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ats_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

# ---- JPA ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Keep the pool small: free hosted MySQL plans allow few connections
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}

# ---- Uploads (resumes are stored in MySQL, table resume_files) ----
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# ---- Security ----
# Must be at least 32 characters. Override with the JWT_SECRET env variable in production.
app.jwt.secret=${JWT_SECRET:dev-only-secret-key-for-ats-change-me-in-production-0123456789}
app.jwt.expiration-ms=86400000
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

# Seeds demo admin / recruiter / candidate accounts and sample jobs on first start (empty DB only)
app.seed-demo-data=${SEED_DEMO_DATA:true}
